steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ai-therapist-portal:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ai-therapist-portal:latest'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/ai-therapist-portal'

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - 'run'
      - '-f=.'
      - '-i=$PROJECT_ID'
      - '-l=gcr.io/$PROJECT_ID/ai-therapist-portal:$COMMIT_SHA'
      - '-o=/workspace/output'

  # Alternative: Deploy directly using gcloud
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'ai-therapist-portal'
      - '--image=gcr.io/$PROJECT_ID/ai-therapist-portal:$COMMIT_SHA'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=3600s'
      - '--set-env-vars=VITE_API_URL=https://service-production.up.railway.app'

images:
  - 'gcr.io/$PROJECT_ID/ai-therapist-portal:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/ai-therapist-portal:latest'

options:
  machineType: 'N1_HIGHCPU_8'
