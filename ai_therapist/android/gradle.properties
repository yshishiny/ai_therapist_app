# Fix for Java 17/21/25 NIO PipeImpl bug on Windows:
# Winsock AF_UNIX connect() silently fails when the socket path > ~50 chars.
# Using a short tmpdir prevents this and allows Gradle daemon IPC to work.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.io.tmpdir=C:/t
android.useAndroidX=true
