name: Deploy to Railway

on:
  push:
    branches:
      - main
    paths:
      - 'portal/**'
      - 'Dockerfile'
      - 'railway.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Link to Railway Project
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "🔗 Linking to Railway project..."
          railway link --project 25becd80-7067-4a31-bbd5-c60728dbb8a2 --force || true
          echo "Project linked"

      - name: Check Services
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "📋 Available services in project:"
          railway service list --json 2>/dev/null | head -50 || railway service list || echo "Could not list services"

      - name: Force Deploy with Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "🚀 Force deploying to Railway..."

          # Get current git commit
          COMMIT=$(git rev-parse --short HEAD)
          echo "Deploying commit: $COMMIT"

          # Try explicit deployment
          echo "Attempting: railway up"
          railway up || true

          echo ""
          echo "Attempting: railway redeploy"
          railway redeploy || true

          echo ""
          echo "✅ Deployment command(s) executed"

      - name: Verify Deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "⏳ Waiting 60 seconds for Railway to start build..."
          sleep 60

          echo "Checking deployment status..."
          railway status || echo "Status check completed"

      - name: Deployment Status
        run: |
          echo "✅ Deployment initiated!"
          echo ""
          echo "📍 Portal URLs:"
          echo "  - https://aitherapistapp-production.up.railway.app"
          echo "  - https://aitherapistapp-portal.up.railway.app"
          echo ""
          echo "📊 Monitor at:"
          echo "  https://railway.app/project/25becd80-7067-4a31-bbd5-c60728dbb8a2"
          echo ""
          echo "⏱️  Build should complete in 5-10 minutes"
