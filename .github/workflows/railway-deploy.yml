name: Deploy to Railway

on:
  push:
    branches:
      - main
    paths:
      - 'portal/**'
      - 'Dockerfile'
      - 'railway.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Configure Railway Project
        run: |
          mkdir -p .railway
          echo '{"projectId":"25becd80-7067-4a31-bbd5-c60728dbb8a2"}' > .railway/config.json

      - name: List Railway Services
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Available services:"
          railway service list || echo "Could not list services"

      - name: Deploy Portal to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "🚀 Deploying portal to Railway..."

          # Simply use railway up with no service specification
          # Railway will use the Dockerfile to build the service
          railway up 2>&1 || true

          # Also try redeploy as backup
          railway redeploy 2>&1 || true

          echo ""
          echo "✅ Deployment submitted to Railway!"
          echo "📍 Portal URL: https://aitherapistapp-production.up.railway.app"
          echo "📊 Monitor: https://railway.app/project/25becd80-7067-4a31-bbd5-c60728dbb8a2"

      - name: Wait for Deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Waiting 30 seconds for deployment to start..."
          sleep 30
          railway status || echo "Status check skipped"

      - name: Deployment Complete
        run: |
          echo "✓ Deployment submitted to Railway"
          echo "✓ Portal URL: https://aitherapistapp-portal.up.railway.app"
