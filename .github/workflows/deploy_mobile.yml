name: Mobile CI/CD (Android Fastlane)

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'ai_therapist/**'

jobs:
  build-and-deploy-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai_therapist/android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Setup Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ./ai_therapist/android

      - name: Install Flutter Dependencies
        working-directory: ./ai_therapist
        run: flutter pub get

      - name: Generate Android Keystore from Secret
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 --decode > app/upload-keystore.jks
        
      - name: Inject Google Play Service Account JSON
        run: |
          echo "${{ secrets.PLAY_STORE_JSON_KEY }}" > play-store-service-account.json

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > local.properties

      # ---------------------------------------------------------
      # DEPLOYMENT ROUTING BASED ON BRANCH
      # ---------------------------------------------------------
      - name: Run Fastlane (DEVELOP branch -> Internal Beta)
        if: github.ref == 'refs/heads/develop'
        env:
          SUPPLY_JSON_KEY: play-store-service-account.json
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bundle exec fastlane android_beta

      - name: Run Fastlane (MAIN branch -> Production)
        if: github.ref == 'refs/heads/main'
        env:
          SUPPLY_JSON_KEY: play-store-service-account.json
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bundle exec fastlane android_production
