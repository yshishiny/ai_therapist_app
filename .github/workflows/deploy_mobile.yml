name: Mobile CI/CD (Android Fastlane)

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'ai_therapist/**'

jobs:
  build-and-deploy-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai_therapist/android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Setup Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ./ai_therapist/android

      - name: Install Flutter Dependencies
        working-directory: ./ai_therapist
        run: flutter pub get

      - name: Decode and Convert Android Keystore
        run: |
          JKS_PATH="${GITHUB_WORKSPACE}/ai_therapist/android/app/upload-keystore.jks"
          P12_PATH="${GITHUB_WORKSPACE}/ai_therapist/android/app/upload-keystore.p12"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${JKS_PATH}"
          keytool -importkeystore \
            -srckeystore "${JKS_PATH}" \
            -destkeystore "${P12_PATH}" \
            -deststoretype PKCS12 \
            -srcalias '${{ secrets.KEY_ALIAS }}' \
            -destalias '${{ secrets.KEY_ALIAS }}' \
            -srcstorepass '${{ secrets.STORE_PASSWORD }}' \
            -deststorepass '${{ secrets.STORE_PASSWORD }}' \
            -srckeypass '${{ secrets.KEY_PASSWORD }}' \
            -destkeypass '${{ secrets.KEY_PASSWORD }}' \
            -noprompt || true

      - name: Inject Google Play Service Account JSON
        run: |
          echo "${{ secrets.PLAY_STORE_JSON_KEY }}" > play-store-service-account.json

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > local.properties

      # ---------------------------------------------------------
      # DEPLOYMENT ROUTING BASED ON BRANCH
      # ---------------------------------------------------------
      - name: Run Fastlane (DEVELOP branch -> Internal Beta)
        if: github.ref == 'refs/heads/develop'
        env:
          SUPPLY_JSON_KEY: play-store-service-account.json
          P12_PATH: ${{ github.workspace }}/ai_therapist/android/app/upload-keystore.p12
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bundle exec fastlane android_beta

      - name: Run Fastlane (MAIN branch -> Production)
        if: github.ref == 'refs/heads/main'
        env:
          SUPPLY_JSON_KEY: play-store-service-account.json
          P12_PATH: ${{ github.workspace }}/ai_therapist/android/app/upload-keystore.p12
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bundle exec fastlane android_production
