name: Backend CI

on:
  push:
    branches:
      - main
      - roadmap
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run Tests
        run: pytest --tb=short -q

      - name: Verify Docker Build (Dry Run)
        working-directory: ${{ github.workspace }}/backend
        run: |
          # Build context = backend/ (matches Railway's Root Directory setting)
          docker build -f Dockerfile -t ai_therapist_backend .

      # ── RAILWAY DEPLOY ─────────────────────────────────────────────────────
      # Railway auto-deploys via its GitHub integration when connected.
      # This explicit CLI step is a fallback — requires RAILWAY_TOKEN and
      # RAILWAY_PROJECT_ID secrets set in GitHub → Settings → Secrets.
      - name: Deploy to Railway (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true   # Railway GitHub integration is primary deploy mechanism
        working-directory: ${{ github.workspace }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          # Install Railway CLI
          npm install -g @railway/cli
          # Link project and deploy backend service
          railway up --service backend --detach
