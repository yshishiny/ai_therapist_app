name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # caching pip dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run Tests
        run: pytest --tb=short -q

      - name: Verify Docker Build (Dry Run)
        working-directory: ${{ github.workspace }}
        run: |
          docker build -f backend/Dockerfile -t ai_therapist_backend .
          
      # Note: We do NOT push or deploy from here. 
      # Railway automatically handles deployment on push to the connected main branch.
