name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run Tests
        run: pytest --tb=short -q

      - name: Verify Docker Build (Dry Run)
        working-directory: ${{ github.workspace }}
        run: |
          docker build -f backend/Dockerfile -t ai_therapist_backend .

      # ── RAILWAY DEPLOY ─────────────────────────────────────────────────────
      # Triggered only on main branch push (not PRs).
      # Railway auto-deploys via GitHub integration when connected.
      # This step provides an explicit fallback via the Railway CLI.
      - name: Deploy to Railway (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: ${{ github.workspace }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Install Railway CLI
          npm install -g @railway/cli
          # Deploy backend service
          railway up --service backend --detach
