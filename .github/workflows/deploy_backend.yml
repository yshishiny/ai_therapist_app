name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # caching pip dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Optional: Add testing/linting here when tests are available
      # - name: Run Linter
      #   run: flake8 .
      # - name: Run Tests
      #   run: pytest

      # backend/Dockerfile expects the repo ROOT as its build context (it does
      # COPY backend/requirements.txt and COPY assessments), so this step opts
      # out of the job-wide `working-directory: ./backend`. Building from inside
      # backend/ fails on the first COPY.
      - name: Verify Docker Build (Dry Run)
        working-directory: .
        run: |
          docker build -f backend/Dockerfile -t ai_therapist_backend .

      # Note: We do NOT push or deploy from here. 
      # Railway automatically handles deployment on push to the connected main branch.
