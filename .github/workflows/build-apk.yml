name: Build Release APK

on:
  push:
    branches: [main, roadmap]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: ai_therapist
        run: flutter pub get

      # ── KEYSTORE SETUP ─────────────────────────────────────────────────────
      - name: Decode Android Keystore
        run: |
          JKS_PATH="${GITHUB_WORKSPACE}/ai_therapist/android/app/upload-keystore.jks"
          P12_PATH="${GITHUB_WORKSPACE}/ai_therapist/android/app/upload-keystore.p12"
          # Decode the secret (may be JKS or PKCS12)
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${JKS_PATH}"
          echo "Decoded $(wc -c < ${JKS_PATH}) bytes"
          # Convert JKS → PKCS12 so AGP can read it reliably
          keytool -importkeystore \
            -srckeystore "${JKS_PATH}" \
            -destkeystore "${P12_PATH}" \
            -deststoretype PKCS12 \
            -srcalias '${{ secrets.KEY_ALIAS }}' \
            -destalias '${{ secrets.KEY_ALIAS }}' \
            -srcstorepass '${{ secrets.STORE_PASSWORD }}' \
            -deststorepass '${{ secrets.STORE_PASSWORD }}' \
            -srckeypass '${{ secrets.KEY_PASSWORD }}' \
            -destkeypass '${{ secrets.KEY_PASSWORD }}' \
            -noprompt || true
          # Verify output
          echo "PKCS12 keystore: $(wc -c < ${P12_PATH} 2>/dev/null || echo 'not created') bytes"

      - name: Remove Windows-only Java home from gradle.properties
        run: sed -i '/org.gradle.java.home/d' ai_therapist/android/gradle.properties

      - name: Strip Windows tmpdir from Gradle JVM args
        run: sed -i 's|-Djava.io.tmpdir=[^ ]*||g' ai_therapist/android/gradle.properties

      - name: Create key.properties
        run: |
          KEYSTORE_ABS="${GITHUB_WORKSPACE}/ai_therapist/android/app/upload-keystore.p12"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            '${{ secrets.STORE_PASSWORD }}' \
            '${{ secrets.KEY_PASSWORD }}' \
            '${{ secrets.KEY_ALIAS }}' \
            "${KEYSTORE_ABS}" \
            > ai_therapist/android/key.properties
          echo "key.properties:"
          cat ai_therapist/android/key.properties

      # ── TESTS ──────────────────────────────────────────────────────────────
      - name: Run Flutter unit tests
        working-directory: ai_therapist
        continue-on-error: true
        run: flutter test --reporter compact

      # ── BUILD ──────────────────────────────────────────────────────────────
      - name: Build release APK
        working-directory: ai_therapist
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }} \
            2>&1 | tee /tmp/flutter-build.log
          grep -E "Built|FAILURE|error:|Exception" /tmp/flutter-build.log | tail -20 || true

      - name: List built APKs
        run: find ai_therapist/build/app/outputs/flutter-apk/ -name "*.apk" -ls || echo "APK not found — check build log above"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AITherapist-release-v${{ github.run_number }}
          path: ai_therapist/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
