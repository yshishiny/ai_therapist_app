name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: ai_therapist
        run: flutter pub get

      - name: Remove Windows-only Java home from gradle.properties
        run: sed -i '/org.gradle.java.home/d' ai_therapist/android/gradle.properties

      - name: Create key.properties
        working-directory: ai_therapist/android
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            '${{ secrets.STORE_PASSWORD }}' \
            '${{ secrets.KEY_PASSWORD }}' \
            '${{ secrets.KEY_ALIAS }}' \
            'app/upload-keystore.jks' \
            > key.properties
          echo "key.properties written:"
          cat key.properties

      - name: Build release APK
        working-directory: ai_therapist
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }} \
            -v 2>&1 | tail -50

      - name: List built APKs
        run: find ai_therapist/build/app/outputs/flutter-apk/ -name "*.apk" -ls

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AITherapist-release-v${{ github.run_number }}
          path: ai_therapist/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
