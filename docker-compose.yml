services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-therapist-api
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "postgresql://therapist:therapist@db:5432/ai_therapist"
      TZ: "Africa/Cairo"
      # ── JWT Auth (required — app crashes without these) ──────────────────
      # Generate a real secret: python -c "import secrets; print(secrets.token_hex(32))"
      JWT_SECRET_KEY: "change-me-use-a-real-secret-in-production"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_TTL_MINUTES: "30"
      REFRESH_TOKEN_TTL_DAYS: "7"
      # ── CORS ─────────────────────────────────────────────────────────────
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8080"
      # ── AI / LLM (LM Studio local default) ───────────────────────────────
      OPENAI_BASE_URL: "http://host.docker.internal:1234/v1"
      OPENAI_API_KEY: "lm-studio"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: ai-therapist-db
    restart: always
    environment:
      POSTGRES_USER: therapist
      POSTGRES_PASSWORD: therapist
      POSTGRES_DB: ai_therapist
    volumes:
      - therapist_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U therapist -d ai_therapist"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  therapist_data:
