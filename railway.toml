# Railway Configuration for AI Therapist Portal
# https://docs.railway.app/reference/railway-toml

[build]
builder = "dockerfile"
dockerfilePath = "./portal/Dockerfile"
watchPatterns = ["portal/**"]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
