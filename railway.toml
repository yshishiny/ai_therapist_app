# Railway Configuration for AI Therapist Portal
# https://docs.railway.app/reference/railway-toml

[build]
builder = "dockerfile"
dockerfilePath = "./Dockerfile.prod"
watchPatterns = ["portal/**"]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[env]
VITE_API_URL = "https://aitherapistapp-production.up.railway.app"
VITE_APP_NAME = "AI Therapist Portal"
VITE_ACCESS_TOKEN_TTL_MINUTES = "30"
NODE_ENV = "production"
